name: Build and test (Arc TV Mac)

# Runs on every push and pull request: compiles the app, runs the tests, and keeps the unsigned DMG as a downloadable build artifact so a
# change can be tried without cutting a release. (Nothing ships to users from here: see release.yml.)
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # The torrent engine (libtorrent) comes from Homebrew; the app's package script copies it into the app.
      - name: Install the torrent engine
        run: brew install libtorrent-rasterbar

      - name: Swift version
        run: swift --version

      # The final link of the app (the mpv libraries) fails on libsmbclient symbols in roughly half of the builds, with identical code, and works
      # the next time (the cause is not known; the order the build tool lists the libraries in is the suspect). Only the link is redone, so trying
      # again is cheap.
      - name: Build
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            if swift build --build-tests; then exit 0; fi
            echo "Build failed (attempt $attempt of 5); trying again from a clean build with freshly downloaded libraries"
            rm -rf .build "$HOME/Library/Caches/org.swift.swiftpm" "$HOME/Library/org.swift.swiftpm"
          done
          exit 1

      - name: Test
        # The build step above built the tests; building them again here relinks the app, which is the step that fails.
        run: swift test --skip-build

      - name: Package the app and DMG
        run: scripts/package-app.sh "0.0.0-ci.${{ github.run_number }}"

      - name: Keep the DMG
        uses: actions/upload-artifact@v4
        with:
          name: ArcTV-dmg
          path: build/ArcTV-*.dmg
          retention-days: 14
